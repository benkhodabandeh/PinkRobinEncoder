[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "pink-robin-encoder"
version = "2026.7.7"
description = "Pink Robin Encoder - cinema-grade FFmpeg encoding with a smooth workflow (Windows)"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "GPL-3.0-only"}
keywords = ["ffmpeg", "video-encoder", "x264", "x265", "customtkinter", "windows"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Win32 (MS Windows)",
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: Multimedia :: Video :: Conversion",
]

[project.urls]
Homepage = "https://github.com/benkhodabandeh/BKVideoEncoder"
Repository = "https://github.com/benkhodabandeh/BKVideoEncoder"

[tool.pytest.ini_options]
testpaths = ["tests"]
# Coverage is REPORT-ONLY here. Do not add --cov-fail-under until a CI run
# measures the true baseline (GUI/encode paths need FFmpeg + display and
# are excluded from unit runs). The gate lives in .github/workflows/ci.yml
# as a separate, explicitly-thresholded step once baselined.
addopts = "-q --cov=src --cov-report=term-missing"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
target-version = "py310"
line-length = 100
extend-exclude = ["build", "dist", ".venv"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "S"]
ignore = ["S101"]

[tool.mypy]
python_version = "3.10"
strict = false
ignore_missing_imports = true
exclude = ["build/", "dist/", ".venv/"]

[tool.bandit]
exclude_dirs = ["tests", "build", "dist", ".venv"]
skips = ["B101"]

[tool.coverage.run]
source = ["src"]
omit = ["src/__init__.py"]
