name: Build Pink Robin Encoder (Nuitka, Windows)

on:
  workflow_dispatch:
  release:
    types: [published]
  push:
    tags:
      - "v*"

permissions:
  contents: write # needed to attach the .7z to releases

jobs:
  build-app:
    name: Nuitka onefile + single-exe archive
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Developer checks (lint/typecheck/test)
        run: python scripts/dev_check.py

      - name: Fetch custom FFmpeg bundle
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/fetch_ffmpeg_bundle.py

      - name: Nuitka build
        # dev_check already ran as a separate step above, so skip the
        # redundant second run inside build.py (same script, same result).
        run: python build.py --skip-tests

      - name: Upload portable archive
        uses: actions/upload-artifact@v6
        with:
          name: PinkRobinEncoder-windows
          path: dist/*.7z
          retention-days: 90
          # The .7z is already maximally compressed; do not waste time
          # re-compressing it inside GitHub's artifact zip wrapper.
          compression-level: 0

      # Attach the straight .7z to the GitHub Release so users download
      # PinkRobinEncoder.<ver>.windows.7z directly (artifacts are always
      # zip-wrapped by GitHub, which caused the old zip-containing-7z).
      - name: Attach .7z to release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ github.ref_name }}" dist/*.7z --clobber
