name: Build Pink Robin Encoder (Nuitka, Windows)

on:
  workflow_dispatch:
  release:
    types: [published]
  push:
    tags:
      - "v*"

jobs:
  build-app:
    name: Nuitka standalone + portable archive
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Developer checks (lint/typecheck/test)
        run: python scripts/dev_check.py

      - name: Fetch custom FFmpeg bundle
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/fetch_ffmpeg_bundle.py

      - name: Nuitka build
        run: python build.py

      - name: Upload portable archive
        uses: actions/upload-artifact@v6
        with:
          name: PinkRobinEncoder-windows
          path: dist/*.7z
          retention-days: 90
