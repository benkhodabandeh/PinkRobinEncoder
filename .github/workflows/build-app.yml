name: Build Pink Robin Encoder (Nuitka, Windows)

on:
  workflow_dispatch:
  release:
    types: [published]
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  # ---- Job 1: Build custom FFmpeg ----
  build-ffmpeg:
    name: Build custom FFmpeg (MSYS2 MinGW64)
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    outputs:
      artifact_name: ffmpeg-windows
    steps:
      - uses: actions/checkout@v6

      - name: Set up MSYS2 (MinGW64)
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: git

      - name: Build tailored FFmpeg
        run: bash scripts/build_ffmpeg_windows.sh

      - name: Package bin/
        shell: pwsh
        run: Compress-Archive -Path bin/* -DestinationPath ffmpeg-windows.zip

      - name: Upload ffmpeg-windows artifact
        uses: actions/upload-artifact@v7
        with:
          name: ffmpeg-windows
          path: ffmpeg-windows.zip
          retention-days: 30

  # ---- Job 2: Build the app (depends on FFmpeg artifact) ----
  build-app:
    name: Nuitka onefile + single-exe archive
    runs-on: windows-latest
    needs: build-ffmpeg
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Developer checks (lint/typecheck/test)
        run: python scripts/dev_check.py

      - name: Download custom FFmpeg bundle
        uses: actions/download-artifact@v6
        with:
          name: ffmpeg-windows
          path: ${{ runner.temp }}/ffmpeg-bundle

      - name: Extract FFmpeg bundle to ./bin
        shell: pwsh
        run: |
          Expand-Archive -Path "${{ runner.temp }}/ffmpeg-bundle/ffmpeg-windows.zip" -DestinationPath bin -Force

      - name: Nuitka build
        run: python build.py --skip-tests

      - name: Upload portable archive
        uses: actions/upload-artifact@v7
        with:
          name: PinkRobinEncoder-windows
          path: dist/*.7z
          retention-days: 90
          compression-level: 0

      - name: Attach .7z to release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ github.ref_name }}" dist/*.7z --clobber