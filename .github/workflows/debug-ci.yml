name: Debug CI output (TEMPORARY SCAFFOLD - delete after green)

# Purpose: this sandbox cannot install mypy/bandit (PyPI blocked), so this
# workflow runs the failing gates in CI and posts their FULL output as a
# public issue comment, which is readable without log-download access.
# DELETE THIS FILE once CI is green; it must never ship in a release.

on:
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  dump:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Run gates, capture output
        shell: pwsh
        run: |
          python -m mypy src > mypy.txt 2>&1
          echo "mypy_exit=$LASTEXITCODE" >> mypy.txt
          python -m bandit -q -r src > bandit.txt 2>&1
          echo "bandit_exit=$LASTEXITCODE" >> bandit.txt
          python -m pytest -q > pytest.txt 2>&1
          echo "pytest_exit=$LASTEXITCODE" >> pytest.txt
          python -m pip_audit --desc --local --disable-pip > pipaudit.txt 2>&1
          echo "pipaudit_exit=$LASTEXITCODE" >> pipaudit.txt

      - name: Post output as issue
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $body = "# CI debug dump ($env:GITHUB_SHA)`n`n"
          foreach ($f in @("mypy.txt", "bandit.txt", "pytest.txt", "pipaudit.txt")) {
            $txt = Get-Content $f -Raw
            if ($txt.Length -gt 20000) { $txt = $txt.Substring(0, 20000) + "`n...[truncated]" }
            $body += "## $f`n```````n$txt`n```````n`n"
          }
          $body | Out-File ci-body.md -Encoding utf8
          gh issue create --title "TEMP debug dump - DO NOT MERGE" --body-file ci-body.md
